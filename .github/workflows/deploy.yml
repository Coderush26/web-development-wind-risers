name: Deploy Wind Risers

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /var/www/wind-risers

            echo ">>> Pulling latest code..."
<<<<<<< HEAD
            git pull origin main
=======
            git fetch origin
            git reset --hard origin/main
>>>>>>> b7af4ba54f95bdf7bd2b2f824afe38c16d16d978

            echo ">>> Building React frontend..."
            cd client
            npm install
            npm run build

            echo ">>> Copying build to Nginx..."
            sudo cp -r build/* /var/www/html/

            echo ">>> Installing backend dependencies..."
            cd ../server
            npm install

            echo ">>> Restarting backend with PM2..."
            pm2 describe wind-risers-backend > /dev/null 2>&1 \
              && pm2 restart wind-risers-backend \
              || pm2 start server.js --name wind-risers-backend
            pm2 save

            echo ">>> Reloading Nginx..."
            sudo nginx -s reload

            echo "✅ Deployment complete!"