name: Deploy CodeRush to vircosa.com

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Server-side secrets — written to server/.env on every deploy
          MONGO_URI:       ${{ secrets.MONGO_URI }}
          JWT_SECRET:      ${{ secrets.JWT_SECRET }}
          PUSHER_APP_ID:   ${{ secrets.PUSHER_APP_ID }}
          PUSHER_KEY:      ${{ secrets.PUSHER_KEY }}
          PUSHER_SECRET:   ${{ secrets.PUSHER_SECRET }}
          PUSHER_CLUSTER:  ${{ secrets.PUSHER_CLUSTER }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          EMAIL_USER:      ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:      ${{ secrets.EMAIL_PASS }}
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     ${{ secrets.SERVER_PORT }}
          # Pass env vars to the remote shell so they're available in the script
          envs: MONGO_URI,JWT_SECRET,PUSHER_APP_ID,PUSHER_KEY,PUSHER_SECRET,PUSHER_CLUSTER,GROQ_API_KEY,EMAIL_USER,EMAIL_PASS
          script: |
            set -e   # abort on any error

            echo ">>> Pulling latest code..."
            cd /var/www/wind-risers
            git fetch origin
            git reset --hard origin/main

            # ── Write server/.env from GitHub Secrets ─────────────────────────
            echo ">>> Writing server/.env..."
            cat > server/.env << ENVEOF
            MONGO_URI=$MONGO_URI
            JWT_SECRET=$JWT_SECRET
            PUSHER_APP_ID=$PUSHER_APP_ID
            PUSHER_KEY=$PUSHER_KEY
            PUSHER_SECRET=$PUSHER_SECRET
            PUSHER_CLUSTER=$PUSHER_CLUSTER
            GROQ_API_KEY=$GROQ_API_KEY
            OPEN_METEO_BASE_URL=https://api.open-meteo.com/v1/forecast
            EMAIL_USER=$EMAIL_USER
            EMAIL_PASS=$EMAIL_PASS
            CLIENT_URL=https://vircosa.com
            ENVEOF
            # strip leading whitespace that heredoc indentation adds
            sed -i 's/^[[:space:]]*//' server/.env

            # ── Build the React client (Vite → dist/) ─────────────────────────
            echo ">>> Building React frontend..."
            cd client
            npm install

            # Inject Pusher keys at build time so Vite bakes them into the bundle
            VITE_PUSHER_KEY=$PUSHER_KEY \
            VITE_PUSHER_CLUSTER=$PUSHER_CLUSTER \
            npm run build

            echo ">>> Copying dist to Nginx webroot..."
            sudo rm -rf /var/www/html/*
            sudo cp -r dist/. /var/www/html/

            # ── Install server dependencies ────────────────────────────────────
            echo ">>> Installing server dependencies..."
            cd ../server
            npm install --omit=dev

            # ── Restart API server with PM2 ────────────────────────────────────
            echo ">>> Restarting API with PM2..."
            pm2 describe wind-risers-backend > /dev/null 2>&1 \
              && pm2 restart wind-risers-backend \
              || pm2 start server.js --name wind-risers-backend
            pm2 save

            # ── Deploy nginx config and reload ─────────────────────────────────
            echo ">>> Updating Nginx config..."
            sudo cp /var/www/wind-risers/nginx/vircosa.conf \
                    /etc/nginx/sites-available/coderush
            sudo ln -sf /etc/nginx/sites-available/coderush \
                        /etc/nginx/sites-enabled/coderush
            # Remove the default site if it's still active
            sudo rm -f /etc/nginx/sites-enabled/default

            sudo nginx -t
            sudo nginx -s reload

            echo "✅ Deployment complete!"
